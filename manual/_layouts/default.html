<!doctype html>
<html lang="{{ site.lang | default: 'ja' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <div class="wa-site">
    {% include header.html %}
    <div class="wa-body">
      {% include nav.html %}
      <main class="wa-content">
        {{ content }}
      </main>
    </div>
    {% include footer.html %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js" defer></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('pre code.language-mermaid').forEach(function (code) {
        var diagram = document.createElement('div');
        diagram.className = 'mermaid';
        diagram.textContent = code.textContent;
        code.parentElement.replaceWith(diagram);
      });
      if (window.mermaid) {
        window.mermaid.initialize({ startOnLoad: true, theme: 'dark', securityLevel: 'strict' });
      }
    });
  </script>
</body>
</html>
